// ============================================================================
// Cockpit Experimentes
// ============================================================================

@KERBALISM_EXPERIMENT_VALUES:NEEDS[FeatureScience]
{
	%SPACELINES
	{
        Spacelines_Supersonic1
        {
            ec_rate = 0
			size = 0.02
			value = 9 
			duration = 1080 // 18 minutes
			requirements = CrewMin:1,SurfaceSpeedMin:343,SurfaceSpeedMax:685,AltitudeMax:80000
            UnlockTech = aerodynamics1
			SetupMass = 0.004
			SetupCost = 2000			
        }

        Spacelines_Supersonic2
        {
            ec_rate = 0
			size = 1.4
			value = 14 
			duration = 1440 // 24 minutes
			requirements = CrewMin:1,SurfaceSpeedMin:686,SurfaceSpeedMax:1028,AltitudeMin:5000,AltitudeMax:80000
            UnlockTech = aerodynamics2
			SetupMass = 0.004
			SetupCost = 2500
        }

        Spacelines_Supersonic3
        {
            ec_rate = 0
			size = 1.6
			value = 16 
			duration = 1440 // 24 minutes
			requirements = CrewMin:1,SurfaceSpeedMin:1029,SurfaceSpeedMax:1714,AltitudeMin:10000,AltitudeMax:80000
            UnlockTech = aerodynamics3
			SetupMass = 0.004
			SetupCost = 3500
        }

        Spacelines_Hypersonic
        {
            ec_rate = 0
			size = 2.0
			value = 20
			duration = 1440 // 24 minutes
			requirements = CrewMin:1,SurfaceSpeedMin:1715,AltitudeMin:30000,AltitudeMax:80000
            UnlockTech = aerodynamics4
			SetupMass = 0.004
			SetupCost = 5000
        }
	}
}

// ----------------------------------------------------------------------------
// Kerbalism experiment definitions
// ----------------------------------------------------------------------------
@EXPERIMENT_DEFINITION:HAS[#id[Spacelines_Supersonic1]]:NEEDS[FeatureScience]:FOR[zzzKerbalismDefault]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_Supersonic1/value$
	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_Supersonic1/size$
	@dataScale /= #$baseValue$
	
    RESULTS
    {
        default = Supersonic flight testing.
    }
    KERBALISM_EXPERIMENT
    {
		SampleMass = 0.002
		BodyAllowed = HomeBody
		Situation = Flying
    }
}

