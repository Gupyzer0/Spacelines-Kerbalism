@KERBALISM_EXPERIMENT_VALUES:NEEDS[FeatureScience]
{
	%SPACELINES
	{
		Spacelines_OrbitalPerturbations
		{
			ECCost = 0.002
			size = 600
			value = 200
			SetupMass =
			SetupCost =			
			duration = 1555200000 // 10 years
			UnlockTech = science3
			requirements = OrbitMinInclination:50,OrbitMaxInclination:130,TrackingStationLevelMin:2,OrbitMaxEccentricity:0.04
			ResourceRates = 
			CrewRequirement = 
		}

		gravityScan
		{
			ECCost = 0.041
			size = 26000
			value = 25
			SetupMass =
			SetupCost =	55000 // very expensive stuff
			duration = 7776000 // 180 days
			requirements = OrbitMinInclination:50,OrbitMaxInclination:130
			ResourceRates =
			UnlockTech = science8
		}	
	}
}

// ----------------------------------------------------------------------------
// Kerbalism Config
// ----------------------------------------------------------------------------

@EXPERIMENT_DEFINITION:HAS[#id[Spacelines_OrbitalPerturbations]]:NEEDS[FeatureScience]:FOR[KerbalismDefault]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/value$
	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/size$
	@dataScale /= #$baseValue$

	KERBALISM_EXPERIMENT
	{
		Situation = InSpaceLow@Biomes
		BodyAllowed = HomeBodyandMoons
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:NEEDS[FeatureScience]:FOR[zzzKerbalismDefault]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/value$
	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/size$
	@dataScale /= #$baseValue$
  
  	KERBALISM_EXPERIMENT
	{
		Situation = Surface@Biomes
		Situation = InSpaceLow
		Situation = InSpaceHigh
		IncludeExperiment = Spacelines_OrbitalPerturbations
	}
}

// ----------------------------------------------------------------------------
// Replacing Experiments with our own experiment
// ----------------------------------------------------------------------------

// Gravity Scan
@PART[*]:HAS[@MODULE[*ModuleScience*]:HAS[#experimentID[gravityScan]]]:NEEDS[FeatureScience]
{
	%Tag_Spacelines_GravityExperiments = True
}

// Creating Configure
@PART[*]:HAS[#Tag_Spacelines_GravityExperiments[True]]:NEEDS[FeatureScience]
{
	MODULE
    {
        name = Experiment
        experiment_id = Spacelines_OrbitalPerturbations
    }

    MODULE
    {
        name = Experiment
        experiment_id = gravityScan
    }

	@MODULE[Configure]:HAS[#title[Unmanned?Experiments]]
	{
        SETUP
        {
            name = Orbital Perturbations Experiment
            desc = By precisely tracking a spacecraft's orbit around a planet or moon, scientists can infer the distribution of mass within that body, which affects its gravitational pull.

            MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = Spacelines_OrbitalPerturbations
			}
        }

        SETUP
        {
            name = Gravimeter Scan
            desc = Installs a highly specialized instrument designed to detect minute distortions in spacetime caused by gravitational waves.

            MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = gravityScan
			}
        }
    }
}

// Setting Experiment Values
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Unmanned?Experiments]]]:NEEDS[FeatureScience]:FOR[KerbalismDefault]
{
	@MODULE[Configure]:HAS[#title[Unmanned?Experiments]]
	{
		@SETUP:HAS[#name[Orbital?Perturbations?Experiment]]
		{
			%tech = #$../../@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/UnlockTech$
			%mass = #$../../@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/SetupMass$
			%cost = #$../../@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/SetupCost$
		}

		@SETUP:HAS[#name[Gravimeter?Scan]]
		{
			%tech = #$../../@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/UnlockTech$
			%mass = #$../../@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/SetupMass$
			%cost = #$../../@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/SetupCost$
		}
	}

	@MODULE[Experiment]:HAS[#experiment_id[Spacelines_OrbitalPerturbations]]
    {
        data_rate = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/size$
        @data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/duration$
        ec_rate = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/Spacelines_OrbitalPerturbations/ECCost$
        allow_shrouded = True
    }
    @MODULE[Experiment]:HAS[#experiment_id[gravityScan]]
    {
        data_rate = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/size$
        @data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/duration$
        ec_rate = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/ECCost$
        allow_shrouded = True
    }
}

// for gravity scanner 
@PART[*]:HAS[#Tag_Spacelines_GravityExperiments[True],!@MODULE[Configure]]:NEEDS[FeatureScience] {
    @MODULE[Experiment]:HAS[#experiment_id[gravityScan]] {
		%ec_rate = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/ECCost$
		%data_rate = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/size$
		@data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/duration$
		%resources = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/ResourceRates$
		%experimentSize = #$@KERBALISM_EXPERIMENT_VALUES/SPACELINES/gravityScan/size$
    }
}

// ----------------------------------------------------------------------------
// Animations
// ----------------------------------------------------------------------------
@PART[*]:HAS[#Tag_Spacelines_GravityExperiments[True],@MODULE:HAS[#animationName]]:NEEDS[FeatureScience]
{
	@MODULE[Experiment],*
	{
		%anim_deploy = #$../MODULE:HAS[#animationName,~name[Experiment]]/animationName$
	}
}

