// ----------------------------------------------------------------------------
// Final pass, setting MTBF based on tier except for:
// - Engines
// - Parachutes
// -----------------------------
// Days are 12 Hrs (JNSQ / KSRSS)
// ----------------------------------------------------------------------------

// ----------------------------------------------------------------------------
// Start -> 1 day
// ----------------------------------------------------------------------------
// You won't be able to use these guys for an interplanetary mission I guess.
@PART[*]:HAS[@MODULE[Reliability],#TechRequired[start],!MODULE[ModuleEngines*],!MODULE[ModuleParachute]]:NEEDS[FeatureReliability]:AFTER[zzzKerbalismDefault]
{
    @MODULE[Reliability],*
    {
        %mtbf = 43200
        %rated_radiation = 0
    }
}

// ----------------------------------------------------------------------------
// Tier 1 -> 15 days
// ----------------------------------------------------------------------------
@PART[*]:HAS[@MODULE[Reliability],#SSS_Tier[1],!MODULE[ModuleEngines*],!MODULE[ModuleParachute]]:NEEDS[FeatureReliability]:AFTER[zzzKerbalismDefault]
{
    @MODULE[Reliability],*
    {
        %mtbf = 43200 * 15
    }
}

