// ----------------------------------------------------------------------------
// Solar Panels
// ----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[SolarPanelFixer],!MODULE[ModuleCommand]]:NEEDS[FeatureReliability]:AFTER[KerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = SolarPanelFixer
		title = Solar Panel
		redundancy = Power Generation
		repair = true
		//mtbf = 36288000
		extra_cost = 2.5
		extra_mass = 1.0
		rated_radiation = 0.15
		radiation_decay_rate = 1
	}
}

@PART[*]:HAS[@MODULE[SolarPanelFixer],@MODULE[ModuleCommand],#CrewCapacity[<1]]:NEEDS[FeatureReliability]:AFTER[KerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = SolarPanelFixer
		title = Solar Panel
		redundancy = Power Generation
		repair = true
		//mtbf = 36288000
		extra_cost = 0.25
		extra_mass = 0.1
		rated_radiation = 0.16
		radiation_decay_rate = 1
	}
}

@PART[*]:HAS[@MODULE[SolarPanelFixer],@MODULE[ModuleCommand],~CrewCapacity[]]:NEEDS[FeatureReliability]:AFTER[KerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = SolarPanelFixer
		title = Solar Panel
		redundancy = Power Generation
		repair = true
		//mtbf = 36288000
		extra_cost = 0.25
		extra_mass = 0.1
		rated_radiation = 0.14
		radiation_decay_rate = 1
	}
}