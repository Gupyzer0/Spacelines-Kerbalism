// ----------------------------------------------------------------------------
// Life Support
// ----------------------------------------------------------------------------

@PART[kerbalism-lifesupportmodule]:NEEDS[ProfileDefault,FeatureReliability]:FOR[KerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = ProcessController
		title = ECLSS
		redundancy = Life Support
		repair = true // anyone
		//mtbf = 72576000 // in seconds
		extra_cost = 2.5
		extra_mass = 0.1
	}
}

@PART[*]:HAS[#CrewCapacity[>0],!MODULE[KerbalSeat]]:NEEDS[ProfileDefault,FeatureReliability]:FOR[KerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = ProcessController
		title = ECLSS
		redundancy = Life Support
		repair = true // anyone
		//mtbf = 72576000
		extra_cost = 0.625
		extra_mass = 0.025
  }
}