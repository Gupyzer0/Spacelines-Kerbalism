//RD-180 - Muo-V-DR180 "Czar"
@PART[bluedog_AtlasV_RD180]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{
  @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
  {
    @rated_operation_duration = 255 
    @rated_ignitions = 1
  }
}

