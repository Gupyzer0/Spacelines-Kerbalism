// ----------------------------------------------------------------------------
// Electric Charge fixes for BDB
// ----------------------------------------------------------------------------

@PART[bluedog_LM_Lab_Battery]:NEEDS[Bluedog_DB]:AFTER[Bluedog_DB]
{
    // TODO: might add weight for gameplay reasons
    @RESOURCE[ElectricCharge]
    {
        %amount = 5000
        %maxAmount = 5000
    }
}

// More EC to OAO probe core
@PART[bluedog_OAO_ProbeCore]:AFTER[Bluedog_DB]
{
    @RESOURCE[ElectricCharge]
    {
        %amount = 2000
        %maxAmount = 2000
    }
}

// Less EC consumption for thefollowing probes
@PART[bluedog_Pioneer_1|bluedog_Pioneer_4|bluedog_Vanguard_Satellite3|bluedog_Beacon1|bluedog_Juno1_Explorer1|bluedog_Vanguard_Satellite2|bluedog_Vanguard_Satellite3]:AFTER[Bluedog_DB]
{
    @MODULE[ModuleCommand]
    {
        @RESOURCE[ElectricCharge]
        {
            %rate *= 0.0001
        }
    }

    @RESOURCE[ElectricCharge]
    {
        %amount = 250
        %maxAmount = 250
    }
}

@PART[bluedog_Agena_Avionics]:HAS[@MODULE[ModuleCommand]]:FOR[KerbalismDefault]
{
    @MODULE[ModuleCommand]
    {
        @RESOURCE[ElectricCharge]
        {
            %rate *= 0.0001
        }
    }

    @RESOURCE[ElectricCharge]
    {
        %amount = 400
        %maxAmount = 400
    }
}