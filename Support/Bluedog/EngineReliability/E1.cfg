// ----------------------------------------------------------------------------
// E-1
// ----------------------------------------------------------------------------

@PART[bluedog_E1_engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // E1
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.05
        @rated_operation_duration = 165
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[E1-2] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.023171
					rated_operation_duration = 165
                    rated_ignitions = 1
				}
			}
        }
    }
}
