// ----------------------------------------------------------------------------
// Apollo SPS
// ----------------------------------------------------------------------------

@PART[bluedog_Apollo_Block2_SPS]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]]
    {
		@turnon_failure_probability = 0.009494
        @rated_operation_duration = 750
        @rated_ignitions = 50
    }
}