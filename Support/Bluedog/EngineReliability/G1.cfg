// G-1
// ----------------------------------------------------------------------------

@PART[bluedog_G1]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // FIRST VARIANT
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.1
        @rated_operation_duration = 375
        @rated_ignitions = 100
    }
}
