// ----------------------------------------------------------------------------
// Agena
// ----------------------------------------------------------------------------

@PART[bluedog_Agena_Engine_XLR81]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{
    // Agena A
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]]
    {
		@turnon_failure_probability = 0.110833
        @rated_operation_duration = 120
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch] {
        // Agena B
        @SUBTYPE[8081] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.055177
					rated_operation_duration = 240
                    rated_ignitions = 3
				}
			}
        }
        // Agena D
        @SUBTYPE[8096] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.014567
					rated_operation_duration = 265
                    rated_ignitions = 3
				}
			}
        }
        // Agena D HDA
        @SUBTYPE[8096HDA] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.014567
					rated_operation_duration = 265
                    rated_ignitions = 4
				}
			}
        }
        // Agena D larger nozzle
        @SUBTYPE[8096B] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.014567
					rated_operation_duration = 265
                    rated_ignitions = 4
				}
			}
        }
        // Growth Agena Study
        @SUBTYPE[8096C] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.014567
					rated_operation_duration = 1200
                    rated_ignitions = 15
				}
			}
        }
    }
}

//Agena secondary engine - Belle-D-4 "Nafuni"
