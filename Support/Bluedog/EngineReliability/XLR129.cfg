// ----------------------------------------------------------------------------
// XLR-129
// ----------------------------------------------------------------------------

@PART[bluedog_XLR129]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // XLR129_250K_B | XLR129_250K_V
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.130952
        @rated_operation_duration = 480
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[XLR129_350K_B|XLR129_350K_V] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.044118
					rated_operation_duration = 480
                    rated_ignitions = 1
				}
			}
        }
    }
}
