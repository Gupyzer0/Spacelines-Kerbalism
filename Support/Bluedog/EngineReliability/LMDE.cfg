// ----------------------------------------------------------------------------
// Lunar Module Descent Engine
// ----------------------------------------------------------------------------

@PART[bluedog_LM_Descent_Engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.01087
        @rated_operation_duration = 1100
        @rated_ignitions = 20
    }
}