// ----------------------------------------------------------------------------
// M-1
// ----------------------------------------------------------------------------

@PART[bluedog_M1]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // M1_Vac | M1_SL
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.0818
        @rated_operation_duration = 500
        @rated_ignitions = 2
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[M1_Vac18|M1_SL18] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.056
					rated_operation_duration = 500
                    rated_ignitions = 2
				}
			}
        }
    }
}
