// ----------------------------------------------------------------------------
// Gemini Lander Engine
// ----------------------------------------------------------------------------

@PART[bluedog_Gemini_Lander_Engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.005556
        @rated_operation_duration = 600
        @rated_ignitions = 35
    }
}
