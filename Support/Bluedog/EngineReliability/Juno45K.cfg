// ----------------------------------------------------------------------------
// Juno 45K
// ----------------------------------------------------------------------------

@PART[bluedog_Juno4_Engine_45K]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // 45K_Base
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.1
        @rated_operation_duration = 135
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[45K_Improved] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.1
					rated_operation_duration = 135
                    rated_ignitions = 1
				}
			}
        }
    }
}
