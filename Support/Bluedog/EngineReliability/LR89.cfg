// ----------------------------------------------------------------------------
// Atlas booster engines -> LR-89 | RS-56
// ----------------------------------------------------------------------------

@PART[bluedog_atlas_LR89engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // XLR-89
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.235816
        @rated_operation_duration = 135
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        // LR89-NA3
        @SUBTYPE[LR89-NA3] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.15
					rated_operation_duration = 135
                    rated_ignitions = 1
				}
			}
        }
        // LR89-NA5
        @SUBTYPE[LR89-NA5] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.055802
					rated_operation_duration = 150
                    rated_ignitions = 1
				}
			}
        }
        // LR89-NA6
        @SUBTYPE[LR89-NA6] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.078654
					rated_operation_duration = 160
                    rated_ignitions = 1
				}
			}
        }
        // LR89-NA7
        @SUBTYPE[LR89-NA7] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.040303
					rated_operation_duration = 165
                    rated_ignitions = 1
				}
			}
        }
        //RS56
        @SUBTYPE[RS56] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.005
					rated_operation_duration = 170
                    rated_ignitions = 1
				}
			}
        }
        // RS56-B
		@SUBTYPE[RS56-B] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.005
					rated_operation_duration = 170
                    rated_ignitions = 1
				}
			}
        }		
    }
}