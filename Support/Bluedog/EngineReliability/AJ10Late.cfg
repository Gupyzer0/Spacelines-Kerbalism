// ----------------------------------------------------------------------------
// AJ10-
// ----------------------------------------------------------------------------

@PART[bluedog_AJ10_118F]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   

    // AJ10-118F
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.00293
        @rated_operation_duration = 450
        @rated_ignitions = 100
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[118K] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.00293
					rated_operation_duration = 450
                    rated_ignitions = 100
				}
			}
        }
        // No data, same as K
        @SUBTYPE[118X] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.00293
					rated_operation_duration = 450
                    rated_ignitions = 100
				}
			}
        }
    }
}