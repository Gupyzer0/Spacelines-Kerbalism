@PART[bluedog_LR87]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // LR87-AJ3
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.135714
        @rated_operation_duration = 137
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[LR87-AJ5] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.05194
					rated_operation_duration = 150
                    rated_ignitions = 1
				}
			}
        }
        @SUBTYPE[LR87-AJ5K] {
