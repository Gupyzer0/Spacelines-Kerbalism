// ----------------------------------------------------------------------------
// H-1 | H-2
// ----------------------------------------------------------------------------

@PART[bluedog_Saturn_Engine_H1]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // H1-C | H1-D
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.028788
        @rated_operation_duration = 155
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[H1-C-73|H1-D-73] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.023171
					rated_operation_duration = 155
                    rated_ignitions = 1
				}
			}
        }
        @SUBTYPE[H2] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.023171
					rated_operation_duration = 155
                    rated_ignitions = 1
				}
			}
        }
        @SUBTYPE[H2FT] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.023171
					rated_operation_duration = 155
                    rated_ignitions = 1
				}
			}
        }
    }
}
