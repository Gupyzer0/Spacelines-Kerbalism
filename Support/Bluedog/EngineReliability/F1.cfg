// ----------------------------------------------------------------------------
// F-1
// ----------------------------------------------------------------------------

@PART[bluedog_Saturn_Engine_F1]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // F1
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.026515
        @rated_operation_duration = 165
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[F1A] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.015
					rated_operation_duration = 315
                    rated_ignitions = 1
				}
			}
        }        
        @SUBTYPE[F1V] {
