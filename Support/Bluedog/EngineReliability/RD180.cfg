@PART[bluedog_AtlasV_RD180engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // FIRST VARIANT
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.02309
        @rated_operation_duration = 255
        @rated_ignitions = 1
    }
}
