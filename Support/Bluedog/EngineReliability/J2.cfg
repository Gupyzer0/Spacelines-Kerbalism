// ----------------------------------------------------------------------------
// J-2
// ----------------------------------------------------------------------------

@PART[bluedog_Saturn_Engine_J2]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // J2
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.060345
        @rated_operation_duration = 500
        @rated_ignitions = 3
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[J2S|J2SL|J2A2|J2A2E] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.013
					rated_operation_duration = 500
                    rated_ignitions = 3
				}
			}
        }
        @SUBTYPE[J2X|J2XA2] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.0335
					rated_operation_duration = 500
                    rated_ignitions = 8
				}
			}
        }
    }
}
