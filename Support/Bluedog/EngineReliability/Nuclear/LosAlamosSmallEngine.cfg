// ----------------------------------------------------------------------------
// Los Alamos Small Engine
// ----------------------------------------------------------------------------

@PART[bluedog_smallNuclearEngine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // FIRST VARIANT
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.01
        @rated_operation_duration = 3600
        @rated_ignitions = 60
    }
}
