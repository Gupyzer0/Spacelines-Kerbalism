@PART[bluedog_SNTP_45|bluedog_STNP_75]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.01
        @rated_operation_duration = 1050
        @rated_ignitions = 60
    }
}
