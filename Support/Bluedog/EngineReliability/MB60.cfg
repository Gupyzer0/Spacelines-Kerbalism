// ----------------------------------------------------------------------------
// MB-60
// ----------------------------------------------------------------------------

@PART[bluedog_MB60]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.02
        @rated_operation_duration = 1130
        @rated_ignitions = 10
    }
}
