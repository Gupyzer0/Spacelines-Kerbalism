@PART[bluedog_RL20]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.0335
        @rated_operation_duration = 500
        @rated_ignitions = 8
    }
}
