// ----------------------------------------------------------------------------
// AJ10-138 - Transtage
// ----------------------------------------------------------------------------

@PART[bluedog_Titan_Transtage]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // Transtage
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.014454
        @rated_operation_duration = 450
        @rated_ignitions = 100
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[Transtage-34D] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
                    turnon_failure_probability = 0.014454
                    rated_operation_duration = 450
                    rated_ignitions = 100
				}
			}
        }
    }
}
