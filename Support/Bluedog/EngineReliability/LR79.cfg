// ----------------------------------------------------------------------------
// LR79
// ----------------------------------------------------------------------------

@PART[bluedog_Thor_LR79]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // S3D
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.193519
        @rated_operation_duration = 182
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[LR79NA11] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.088438
					rated_operation_duration = 165
                    rated_ignitions = 1
				}
			}
        }
        @SUBTYPE[LR79NA13] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.04933
					rated_operation_duration = 260
                    rated_ignitions = 1
				}
			}
        }
        @SUBTYPE[RS27] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.021947
					rated_operation_duration = 240
                    rated_ignitions = 1
				}
			}
        }
        @SUBTYPE[RS27A] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.00669
					rated_operation_duration = 265
                    rated_ignitions = 1
				}
			}
        }
    }
}

// S3D Vernier
@PART[bluedog_Jupiter_Vernier]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{
	@MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
	{
		@rated_operation_duration = 182
		@rated_ignitions = 1
	}
}
