@PART[bluedog_C1engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.02
        @rated_operation_duration = 2000
        @rated_ignitions = 100
    }
}
