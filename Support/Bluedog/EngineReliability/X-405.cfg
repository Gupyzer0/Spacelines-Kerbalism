// ----------------------------------------------------------------------------
// X-405
// ----------------------------------------------------------------------------

// Vanguard
@PART[bluedog_Vanguard_GE405]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // X-405
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.201515
        @rated_operation_duration = 145
        @rated_ignitions = 1
    }
}

// Vega
@PART[bluedog_Vega_GE405H]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // GE-405H
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.2
        @rated_operation_duration = 245
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[GE-405H-U] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.15
					rated_operation_duration = 245
                    rated_ignitions = 3
				}
			}
        }
    }
}
