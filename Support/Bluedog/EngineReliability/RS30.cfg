// ----------------------------------------------------------------------------
// RS-30
// ----------------------------------------------------------------------------

@PART[bluedog_RS30]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // FIRST VARIANT
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.033333
        @rated_operation_duration = 7200
        @rated_ignitions = 60
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 
					rated_operation_duration = 
                    rated_ignitions = 
				}
			}
        }
    }
}
