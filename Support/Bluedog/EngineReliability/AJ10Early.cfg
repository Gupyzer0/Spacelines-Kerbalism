@PART[bluedog_Able_Engine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{
    // AJ10-37
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]]
    {
        @turnon_failure_probability = 0.175
        @rated_operation_duration = 115
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch] {
        // AJ10-118D
        @SUBTYPE[AbleAJ10-118D] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
                    turnon_failure_probability = 0.079167
					rated_operation_duration = 180
                    rated_ignitions = 1
				}
			}
        }
        // AJ10-104
        @SUBTYPE[AblestarAJ10-104] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
                    turnon_failure_probability = 0.105556
					rated_operation_duration = 300
                    rated_ignitions = 100
				}
			}
        }
        // AJ10-118E
        @SUBTYPE[AblestarAJ10-118E] {
			MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
                    turnon_failure_probability = 0.013014
					rated_operation_duration = 400
                    rated_ignitions = 100
				}
			}
        }
    }
}