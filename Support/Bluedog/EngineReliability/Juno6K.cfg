// ----------------------------------------------------------------------------
// Juno 6K
// ----------------------------------------------------------------------------

@PART[bluedog_Juno4_Engine_6K]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // 6K_Base
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.1
        @rated_operation_duration = 450
        @rated_ignitions = 3
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[6K_Improved] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.079167
					rated_operation_duration = 450
                    rated_ignitions = 3
				}
			}
        }
    }
}
