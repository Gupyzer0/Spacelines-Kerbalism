// ----------------------------------------------------------------------------
// A-7 | A-6H
// ----------------------------------------------------------------------------

@PART[bluedog_Redstone_A7_TailUnit|bluedog_Redstone_QuadEngine]:HAS[@MODULE[Reliability]]:NEEDS[Bluedog_DB,FeatureReliability]:AFTER[KerbalismDefault]
{   
    // Redstone_A7
    @MODULE[Reliability]:HAS[#type[ModuleEngines*]] 
    {
        @turnon_failure_probability = 0.1625
        @rated_operation_duration = 143
        @rated_ignitions = 1
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[Engine?Config]] {
        @SUBTYPE[Redstone_A7_2] {
            MODULE
			{
				IDENTIFIER
				{
					name = Reliability
				}

				DATA
				{
					turnon_failure_probability = 0.1625
					rated_operation_duration = 155
                    rated_ignitions = 1
				}
			}
        }
    }
}
