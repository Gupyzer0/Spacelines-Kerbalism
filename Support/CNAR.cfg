// CNAR 1.9

// Patches made in FINAL because of wacapella.

// Removing redundant parts
!PART[CapellaExperiment2] {}
!PART[CapellaExperiment3] {}

// Less EC Consumption for the capella experiment
@PART[CapellaExperiment1]:FINAL {
    !MODULE[ModuleScienceExperiment] {}

    @MODULE[ModuleCommand]
    {
        @RESOURCE[ElectricCharge]
        {
            %rate *= 0.001
        }
    }
}

// Setting everything to be /4 of real world quantities.
@PART[CapellaEngine1]:FINAL
{
    @mass = 0.078

    @MODULE[ModuleEnginesFX]
	{
		@maxThrust = 1.675
	}

    // Fuel to default values
    @RESOURCE[LiquidFuel]
	{
		@amount = 4.5
		@maxAmount = 4.5
	}
	@RESOURCE[Oxidizer]
	{
		@amount = 5.5
		@maxAmount = 5.5
	}
}
