// CNAR 1.9

// Patches made in FINAL because of wacapella.

// Removing redundant parts
!PART[CapellaExperiment2] {}
!PART[CapellaExperiment3] {}

// Less EC Consumption for the capella experiment
@PART[CapellaExperiment1]:FINAL {
    !MODULE[ModuleScienceExperiment] {}

    @MODULE[ModuleCommand]
    {
        @RESOURCE[ElectricCharge]
        {
            %rate *= 0.0001
        }
    }

    @RESOURCE[ElectricCharge]
    {
        %amount = 20
        %maxAmount = 20
    }
}

// Setting everything to be /4 of real world quantities.
@PART[CapellaEngine1]:FINAL
{
    @mass = 0.078

    @MODULE[ModuleEnginesFX]
	{
		@maxThrust = 1.675
	}

    // Fuel to default values
    @RESOURCE[LiquidFuel]
	{
		@amount = 4.5
		@maxAmount = 4.5
	}
	@RESOURCE[Oxidizer]
	{
		@amount = 5.5
		@maxAmount = 5.5
	}

	MODULE
	{
        name = ModuleEngineIgnitor
		IgnitionsAvailable = 1
		IgnitionsRemained = 1

		AutoIgnitionTemperature = 500
		IgnitorType = Internal

		UseUllageSimulation = true
		ChanceWhenUnstable = 0.2
	}

    MODULE
    {
        name = ModuleWaterfallFX
        // This is a custom name and should be unique in the config. 
        // It will also be used for UI display
        moduleID = Wac_Sustainer
        // This links the effects to a given ModuleEngines. 
        // If not found or not specified, it will use the first one it finds
        //engineID = basicEngine
    }
}

@PART[TitovEngine1]:FINAL {
    MODULE
    {
        name = ModuleWaterfallFX
        // This is a custom name and should be unique in the config. 
        // It will also be used for UI display
        moduleID = A-4_Engine
        // This links the effects to a given ModuleEngines. 
        // If not found or not specified, it will use the first one it finds
        //engineID = basicEngine
    }

    MODULE
	{
        name = ModuleEngineIgnitor
		IgnitionsAvailable = 1
		IgnitionsRemained = 1

		AutoIgnitionTemperature = 500
		IgnitorType = External (launch Clamp)

		UseUllageSimulation = true
		ChanceWhenUnstable = 0.2
	}
}
